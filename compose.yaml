services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 1L6g7nGhU-eAKLJ9W9KZxA
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 9092"]
      interval: 5s
      timeout: 5s
      retries: 15


  api:
    build: ./ingestion_service
    container_name: api
    ports:
     - "8000:8000"
    environment:
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092

      MONGO_LOADER_HOST: mongodb-loader
      MONGO_LOADER_PORT: 8001
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend


  mongodb-loader:
    build: ./loader_mongo
    container_name: mongodb-loader
    ports:
     - "8001:8001"
    environment:
      MONGO_URI: mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend


  clean-consumer:
    build: ./clean_consumer
    container_name: clean-consumer
    ports:
     - "8002:8002"
    environment:
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
     - backend


  elasticsearch:
    image: elasticsearch:7.17.10
    container_name: elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
     - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 5s
      timeout: 5s
      retries: 20

  kibana:
    image: kibana:7.17.10
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
     - backend

  elastic-indexer:
    build: ./elastic_indexer
    container_name: elastic-indexer
    environment:
      ELASTIC_HOST: elasticsearch
      ELASTIC_PORT: 9200

      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
     - backend


  analytics:
    build: ./analytics
    container_name: analytics
    environment:
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
     - backend



networks:
  backend:
    driver: bridge


volumes:
  kafka_data:
  mongo_data: